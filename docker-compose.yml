services:
  zookeeper-1:
    image: zookeeper:3.9
    container_name: zookeeper-1
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=0.0.0.0:2888:3888;2181 server.2=zookeeper-2:2888:3888;2181 server.3=zookeeper-3:2888:3888;2181
    ports:
      - "2181:2181"
    volumes:
      - zookeeper1_data:/data
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper-2:
    image: zookeeper:3.9
    container_name: zookeeper-2
    environment:
      ZOO_MY_ID: 2
      ZOO_SERVERS: server.1=zookeeper-1:2888:3888;2181 server.2=0.0.0.0:2888:3888;2181 server.3=zookeeper-3:2888:3888;2181
    ports:
      - "2182:2181"
    volumes:
      - zookeeper2_data:/data
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper-3:
    image: zookeeper:3.9
    container_name: zookeeper-3
    environment:
      ZOO_MY_ID: 3
      ZOO_SERVERS: server.1=zookeeper-1:2888:3888;2181 server.2=zookeeper-2:2888:3888;2181 server.3=0.0.0.0:2888:3888;2181
    ports:
      - "2183:2181"
    volumes:
      - zookeeper3_data:/data
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD",
          "/opt/kafka/bin/kafka-broker-api-versions.sh",
          "--bootstrap-server",
          "localhost:9092",
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 15s

  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cloud_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: api-gateway
      KAFKA_GROUP_ID: api-gateway-service
      JWT_SECRET: dev-jwt-secret-change-in-prod
      JWT_REFRESH_SECRET: dev-jwt-refresh-secret-change-in-prod
      INTERNAL_JWT_SECRET: dev-internal-secret-change-in-prod
      METRICS_SERVICE_URL: http://metrics-service:3004
      USERS_SERVICE_URL: http://users-service:3005
    depends_on:
      kafka:
        condition: service_healthy
      users-service:
        condition: service_started
    restart: unless-stopped

  deployment-service:
    build:
      context: .
      dockerfile: apps/deployment-service/Dockerfile
    container_name: deployment-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://user:password@postgres-db:5432/deployment_db
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: deployment-service
      KAFKA_GROUP_ID: deployment-service
    depends_on:
      kafka:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
    restart: unless-stopped

  scheduler-service:
    build:
      context: .
      dockerfile: apps/scheduler-service/Dockerfile
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://user:password@postgres-db:5432/scheduler_db
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: scheduler-service
      KAFKA_GROUP_ID: scheduler-service
      ZK_CONNECTION_STRING: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
    depends_on:
      kafka:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
      zookeeper-1:
        condition: service_healthy
      zookeeper-2:
        condition: service_healthy
      zookeeper-3:
        condition: service_healthy
    restart: unless-stopped

  metrics-service:
    build:
      context: .
      dockerfile: apps/metrics-service/Dockerfile
    container_name: metrics-service
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      DATABASE_URL: postgresql://user:password@postgres-db:5432/metrics_db
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: metrics-service
      KAFKA_GROUP_ID: metrics-service
      INTERNAL_JWT_SECRET: dev-internal-secret-change-in-prod
    depends_on:
      kafka:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
    restart: unless-stopped

  users-service:
    build:
      context: .
      dockerfile: apps/users-service/Dockerfile
    container_name: users-service
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      DATABASE_URL: postgresql://user:password@postgres-db:5432/users_db
      INTERNAL_JWT_SECRET: dev-internal-secret-change-in-prod
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  zookeeper1_data:
  zookeeper2_data:
  zookeeper3_data:
  kafka_data:
  postgres_data:
