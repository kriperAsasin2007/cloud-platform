version: '3.8'

# Run this on the Linux worker machine.
# Prerequisites:
#   - Docker daemon running
#   - Copy apps/worker-node/.env.example → apps/worker-node/.env and fill in values
#   - Kafka must be reachable at KAFKA_BROKERS from this machine

services:
  postgres-worker:
    image: postgres:15-alpine
    container_name: postgres-worker
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: worker_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_worker_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker-node:
    build:
      context: .
      dockerfile: apps/worker-node/Dockerfile
    env_file:
      - apps/worker-node/.env
    ports:
      - "${SSH_PROXY_PORT:-2222}:${SSH_PROXY_PORT:-2222}"
      - "${PORT:-3003}:${PORT:-3003}"
    volumes:
      # Mount Docker socket so the worker can manage containers
      - /var/run/docker.sock:/var/run/docker.sock
    # NOTE: network_mode: host means DATABASE_URL must use localhost:5433, not postgres-worker:5432
    network_mode: host
    depends_on:
      postgres-worker:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_worker_data:
